[project]
name = "recipe-storage"
version = "0.1.0"
description = "Simple python API for storing and retrieving recipes."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.126",
  "sqlalchemy>=2.0",
  "uvicorn>=0.38",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=9.0",
    "ruff>=0.14",
]

